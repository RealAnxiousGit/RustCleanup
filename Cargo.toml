[package]
name = "rustcleanup"
version = "1.0.0"
edition = "2024"
description = "Windows 11 optimization and debloating utility written in Rust"
license = "MIT"
repository = "https://github.com/RealAnxiousGit/RustCleanup"
build = "build.rs"

[[bin]]
name = "RustCleanup"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
sysinfo = "0.40.1"
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
