[package]
name = "rustcleanup"
version = "4.0.0"
edition = "2024"
description = "Windows 11 and Linux optimization and debloating utility written in Rust"
license = "MIT"
repository = "https://github.com/RealAnxiousGit/RustCleanup"
build = "build.rs"

[[bin]]
name = "RustCleanup"
path = "src/main.rs"

[dependencies]
# glow (OpenGL) is the default renderer: v1 idled at ~320 MB working set
# with wgpu, glow needs a fraction of that for a 2D UI. wgpu (Direct3D 12
# only) is kept for the optional "Hardware-accelerated UI" setting.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "wgpu_no_default_features",
] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.40.1"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }
winreg = "0.56.0"
# For `#[implement]` (the video player's Media Foundation callback).
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux: X11 and Wayland windows, and Vulkan for the hardware-accelerated UI.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "x11"] }
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }
libc = "0.2"
# The tray icon (StatusNotifierItem) and notifications, both over D-Bus.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# eframe 0.37.0 with one fix: closing a detached window crashed the Intel
# OpenGL driver. See patches/README.md.
[patch.crates-io]
eframe = { path = "patches/eframe" }
